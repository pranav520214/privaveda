name: Verify synthetic Fast Arm
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest backend/tests -q
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Retrieve private ephemeral credentials
        run: |
          mkdir -p .local
          docker compose cp backend:/app/runtime/demo-credentials.txt .local/container-credentials.txt
          chmod 600 .local/container-credentials.txt
      - run: python scripts/smoke.py --credentials-file .local/container-credentials.txt --expected-database postgresql
      - name: Restart without deleting volumes
        run: |
          docker compose restart backend frontend
          docker compose up --wait --wait-timeout 120
      - run: python scripts/smoke.py --credentials-file .local/container-credentials.txt --verify-only --expected-database postgresql
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          E2E_CREDENTIALS_FILE: ../.local/container-credentials.txt
        run: npm test
      - if: always()
        run: docker compose down
