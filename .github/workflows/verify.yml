name: PRIVAVEDA CI

on:
  push:
    branches: [main, codex/native-medical]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------
  # Job 1: PRIVAVEDA Unit, Numerical, Security & Property Tests
  # -------------------------------------------------------
  privaveda-tests:
    name: "PRIVAVEDA Test Suite (110 tests)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run full pytest battery
        env:
          PRIVAVEDA_OFFLINE: "true"
        run: |
          python -m pytest backend/tests -v --tb=short

  # -------------------------------------------------------
  # Job 2: 21-Step Golden Demonstration (E2E)
  # -------------------------------------------------------
  golden-demo:
    name: "Golden Demo (21 steps)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: privaveda-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run 21-step golden demonstration
        env:
          PRIVAVEDA_OFFLINE: "true"
        run: |
          python scripts/run_golden_demo.py

  # -------------------------------------------------------
  # Job 3: Baseline Fast Arm (preserved)
  # -------------------------------------------------------
  baseline-backend:
    name: "Baseline Fast Arm Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
